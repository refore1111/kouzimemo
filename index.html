<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>物件立会い・工事メモ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

:root{
  --ink:#1B2430; --panel:#24344A; --panel-2:#2E4361; --line:#6E93AE;
  --paper:#EEF0EA; --paper-2:#E3E6DD; --amber:#E8A33D; --amber-dark:#C7841F;
  --red:#C24A32; --green:#3E7A5E; --text:#1B2430; --text-soft:#4B5A68; --text-inv:#EEF0EA;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ink);font-family:'Noto Sans JP',sans-serif;color:var(--text);display:flex;justify-content:center;min-height:100vh;}
#app{width:100%;max-width:560px;background:var(--paper);min-height:100vh;position:relative;display:flex;flex-direction:column;}

.storage-warning{background:#C24A32;color:#fff;font-size:12.5px;font-weight:700;padding:10px 14px;text-align:center;line-height:1.5;}
header{background:linear-gradient(155deg, var(--panel) 0%, var(--ink) 100%);color:var(--text-inv);padding:18px 18px 14px;position:relative;overflow:hidden;border-bottom:4px solid var(--amber);}
header::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 28px),repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 28px);pointer-events:none;}
.h-top{display:flex;align-items:baseline;justify-content:space-between;position:relative;z-index:1;}
.h-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;letter-spacing:1px;line-height:1;}
.h-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:3px;color:var(--amber);font-weight:700;}
.h-datetime{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#B9C4CD;text-align:right;line-height:1.3;}
.h-datetime b{color:var(--text-inv);font-size:16px;display:block;}

nav#tabs{display:flex;overflow-x:auto;background:var(--ink);border-bottom:1px solid var(--panel-2);position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch;}
nav#tabs::-webkit-scrollbar{display:none;}
nav#tabs button{flex:0 0 auto;background:none;border:none;color:#8FA0AC;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav#tabs button.active{color:var(--amber);border-bottom-color:var(--amber);}

main{padding:16px 16px 130px;flex:1;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

.card{background:#fff;border:1px solid var(--paper-2);border-left:4px solid var(--panel);border-radius:6px;padding:14px;margin-bottom:14px;}
.card h3{margin:0 0 10px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--panel);letter-spacing:1px;}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field-label{display:block;font-size:12.5px;color:var(--text-soft);font-weight:700;margin-bottom:6px;letter-spacing:.5px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1.5px solid var(--panel);background:var(--paper);color:var(--panel);font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:background .12s,color .12s;}
.chip:active{transform:scale(.96);}
.chip.selected{background:var(--panel);color:#fff;}
.chip.yes.selected{background:var(--green);border-color:var(--green);}
.chip.no.selected{background:var(--red);border-color:var(--red);}
.chip.master-chip{cursor:default;background:var(--paper);color:var(--text);}
.chip-x{margin-left:8px;font-weight:800;cursor:pointer;color:var(--red);}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;border:1.5px solid var(--panel);border-radius:6px;padding:9px 10px;font-size:15px;
  font-family:'Noto Sans JP',sans-serif;background:#fff;color:var(--text);appearance:none;-webkit-appearance:none;
}
select{background-image:linear-gradient(45deg, transparent 50%, var(--panel) 50%),linear-gradient(135deg, var(--panel) 50%, transparent 50%);background-position:calc(100% - 18px) center, calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
textarea{min-height:90px;resize:vertical;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);}
.inline-suffix{display:flex;align-items:center;gap:6px;}
.inline-suffix input{flex:1;}
.inline-suffix span{font-size:13px;color:var(--text-soft);white-space:nowrap;}
.subrow{display:flex;gap:8px;margin-top:8px;}
.subrow > div{flex:1;}

/* aircon repeatable */
.aircon-block{border:1px dashed var(--line);border-radius:6px;padding:10px;margin-bottom:10px;position:relative;}
.aircon-block .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;font-weight:700;}
.add-line{width:100%;border:1.5px dashed var(--panel);background:none;color:var(--panel);border-radius:6px;padding:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}

/* work items */
.work-row{background:#fff;border:1px solid var(--paper-2);border-left:4px solid var(--amber-dark);border-radius:6px;padding:12px;margin-bottom:12px;position:relative;}
.work-row .rm{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;font-weight:700;}
.property-row{background:#fff;border:1px solid var(--paper-2);border-left:4px solid var(--panel);border-radius:6px;padding:12px 44px 12px 14px;margin-bottom:10px;position:relative;}
.property-row .rm{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;font-weight:700;}
.property-name{font-weight:700;font-size:14.5px;color:var(--panel);margin-bottom:5px;}
.property-address{font-size:12.5px;color:var(--text-soft);margin-bottom:6px;line-height:1.5;}
.property-tags{display:flex;gap:8px;flex-wrap:wrap;}
.property-tag{background:var(--paper);border:1px solid var(--paper-2);border-radius:12px;padding:3px 11px;font-size:11.5px;color:var(--panel);font-weight:700;}
.work-details{margin-top:10px;border-top:1px dashed var(--paper-2);padding-top:10px;display:none;}
.work-details.open{display:block;}
.toggle-details{background:none;border:none;color:var(--panel);font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 0 0;}
.new-chip-input{display:flex;gap:6px;margin-top:8px;}
.new-chip-input input{flex:1;}
.new-chip-input button{background:var(--panel);color:#fff;border:none;border-radius:6px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;}
.qty-row{display:flex;gap:6px;}
.qty-row input{flex:1;}
.calc-btn{width:42px;flex:0 0 42px;border:1.5px solid var(--panel);background:var(--paper);border-radius:6px;font-size:17px;cursor:pointer;}
.amount-row{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--paper-2);border-radius:6px;padding:9px 12px;margin-top:8px;}
.amount-label{font-size:12.5px;color:var(--text-soft);font-weight:700;}
.amount-value{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--panel);}

/* document creation tab */
.doc-item-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--paper-2);font-size:13.5px;}
.doc-item-row:last-child{border-bottom:none;}
.doc-item-row input[type=checkbox]{margin-top:3px;width:18px;height:18px;flex:0 0 auto;}
.doc-item-row .doc-item-text{flex:1;line-height:1.5;}
.doc-item-row .doc-item-text b{color:var(--panel);}
.doc-totals{background:var(--paper);border:1px solid var(--paper-2);border-radius:6px;padding:10px 14px;margin-top:4px;}
.doc-totals div{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;}
.doc-totals div.grand{border-top:1px solid var(--paper-2);margin-top:4px;padding-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--panel);}
.doc-empty-note{font-size:12.5px;color:var(--text-soft);padding:10px 0;}

.save-bar{position:sticky;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg, var(--paper) 70%, rgba(238,240,234,0));display:flex;flex-direction:column;gap:8px;}
.save-bar-row{display:flex;gap:8px;}
.save-bar-row button{flex:1;background:var(--paper-2);color:var(--panel);border:none;border-radius:8px;padding:11px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;}
#saveBtn{width:100%;border:none;border-radius:8px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:1.5px;cursor:pointer;background:var(--amber);color:var(--ink);box-shadow:0 4px 0 var(--amber-dark);}
#saveBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-dark);}

.log-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--panel);letter-spacing:1.5px;border-bottom:3px solid var(--panel);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;}
.log-title span{font-size:12.5px;font-weight:600;color:var(--text-soft);}
.empty-log{text-align:center;color:var(--text-soft);font-size:14px;padding:26px 10px;border:1.5px dashed var(--line);border-radius:8px;}
.entry{background:#fff;border:1px solid var(--paper-2);border-left:5px solid var(--amber-dark);border-radius:6px;padding:12px 14px 8px;margin-bottom:10px;}
.entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.entry-project{font-weight:700;font-size:15px;}
.entry-time{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-soft);white-space:nowrap;}
.entry-meta{font-size:12.5px;color:var(--text-soft);margin:5px 0;}
.entry-actions{display:flex;gap:6px;border-top:1px solid var(--paper-2);padding-top:7px;margin-top:6px;}
.entry-actions button{flex:1;border:none;background:var(--paper);color:var(--panel);font-size:12px;font-weight:600;padding:7px 2px;border-radius:5px;cursor:pointer;}
.entry-actions button.del{color:var(--red);}
.entry-actions button.copy.copied{color:var(--green);}

/* settings */
.settings-subnav{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.settings-subnav::-webkit-scrollbar{display:none;}
.settings-tab-btn{flex:0 0 auto;border:1.5px solid var(--panel);background:#fff;color:var(--panel);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:1px;padding:8px 16px;border-radius:20px;cursor:pointer;}
.settings-tab-btn.active{background:var(--panel);color:#fff;}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper-2);}
.price-row:last-child{border-bottom:none;}
.price-row .field-label{margin-bottom:0;flex:1;}
.price-row input{width:110px;flex:0 0 auto;}
.settings-group-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--panel);letter-spacing:1px;margin:18px 0 8px;border-bottom:2px solid var(--panel);padding-bottom:4px;}
.settings-group:first-child .settings-group-title{margin-top:0;}
.reset-master{margin-top:10px;background:none;border:none;color:var(--text-soft);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
.settings-intro{font-size:13px;color:var(--text-soft);background:#fff;border:1px solid var(--paper-2);border-radius:6px;padding:10px 12px;margin-bottom:16px;}

/* calculator overlay */
.calc-overlay{display:none;position:fixed;inset:0;background:rgba(27,36,48,.6);z-index:60;align-items:center;justify-content:center;}
.calc-overlay.show{display:flex;}
.calc-box{background:#fff;border-radius:10px;padding:16px;width:280px;max-width:88vw;}
.calc-display{background:var(--ink);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:28px;text-align:right;padding:10px 12px;border-radius:6px;margin-bottom:10px;min-height:40px;overflow-x:auto;white-space:nowrap;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc-grid button{padding:14px 0;font-size:18px;border:1px solid var(--paper-2);background:var(--paper);border-radius:6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;color:var(--text);}
.calc-grid button.wide{grid-column:span 2;background:var(--panel);color:#fff;}
.calc-actions{display:flex;gap:8px;margin-top:12px;}
.calc-actions button{flex:1;border:none;border-radius:6px;padding:10px;font-weight:700;cursor:pointer;}
#calcCancel{background:var(--paper-2);color:var(--panel);}
#calcOk{background:var(--amber);color:var(--ink);}
.no-print{}
</style>
</head>
<body>
<div id="app">
  <div id="storageWarning" class="storage-warning" style="display:none;">⚠ この画面ではデータを保存できないようです。プライベートブラウズモードや、ファイルを直接開いている場合は保存されないことがあります。GitHub Pagesなど通常のURLで開いてお試しください。</div>
  <header>
    <div class="h-top">
      <div>
        <div class="h-sub">立会い・工事記録</div>
        <div class="h-title">物件メモ</div>
      </div>
      <div class="h-datetime"><b id="nowDate">--</b><span id="nowTime">--:--</span></div>
    </div>
  </header>

  <nav id="tabs">
    <button data-tab="basic" class="active">基本情報</button>
    <button data-tab="equip">設備チェック</button>
    <button data-tab="work">工事・清掃</button>
    <button data-tab="notes">採寸・備考</button>
    <button data-tab="docs">書類作成</button>
    <button data-tab="log">記録一覧</button>
    <button data-tab="settings">設定</button>
  </nav>

  <main>
    <div class="tabpanel active" id="tab-basic"></div>
    <div class="tabpanel" id="tab-equip"></div>
    <div class="tabpanel" id="tab-work"></div>
    <div class="tabpanel" id="tab-notes"></div>
    <div class="tabpanel" id="tab-docs"></div>
    <div class="tabpanel" id="tab-log">
      <div class="log-title">記録一覧 <span id="logCount"></span></div>
      <div id="logList"></div>
    </div>
    <div class="tabpanel" id="tab-settings">
      <div class="settings-intro">プルダウンの選択肢はここで自由に追加・削除できます。追加した項目は次回以降、各タブの入力ですぐ選べるようになります。</div>
      <div id="settingsBody"></div>
    </div>
  </main>

  <div class="save-bar">
    <div class="save-bar-row">
      <button id="resetBtn" type="button">新規作成</button>
      <button id="pdfBtn" type="button">PDF出力</button>
    </div>
    <button id="saveBtn" type="button">記録として保存</button>
  </div>
</div>

<div class="calc-overlay" id="calcOverlay">
  <div class="calc-box">
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
      <button data-c="7">7</button><button data-c="8">8</button><button data-c="9">9</button><button data-c="op" data-op="/">÷</button>
      <button data-c="4">4</button><button data-c="5">5</button><button data-c="6">6</button><button data-c="op" data-op="*">×</button>
      <button data-c="1">1</button><button data-c="2">2</button><button data-c="3">3</button><button data-c="op" data-op="-">−</button>
      <button data-c="0">0</button><button data-c=".">.</button><button data-c="back">←</button><button data-c="op" data-op="+">＋</button>
      <button data-c="clear" class="wide">C</button><button data-c="eq" class="wide">＝</button>
    </div>
    <div class="calc-actions">
      <button type="button" id="calcCancel">キャンセル</button>
      <button type="button" id="calcOk">この値を入力</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $=(id)=>document.getElementById(id);
  // このファイルは Claude.ai のプレビュー内でも、GitHub Pages等で単独ホスティングした場合でも動くようにする。
  // window.storage は Claude.ai のアーティファクト表示内でのみ使える特殊なAPIなので、
  // それが無い環境（GitHub Pagesや普通のブラウザで直接開いた場合）では localStorage を代わりに使う。
  const hasArtifactStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
  const storageAPI = hasArtifactStorage ? window.storage : {
    async get(key){
      try{ const raw = localStorage.getItem(key); return raw===null ? null : {value: raw}; }
      catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(key, value); return {value}; }
      catch(e){ console.error(e); return null; }
    }
  };
  async function checkStorageWorking(){
    try{
      const testKey='__storage_selftest__';
      const setRes = await storageAPI.set(testKey, 'ok');
      const getRes = setRes ? await storageAPI.get(testKey) : null;
      const ok = !!(getRes && getRes.value==='ok');
      const warn = document.getElementById('storageWarning');
      if(warn) warn.style.display = ok ? 'none' : 'block';
      return ok;
    }catch(e){
      const warn = document.getElementById('storageWarning');
      if(warn) warn.style.display = 'block';
      return false;
    }
  }
  function warnSaveFailed(){
    alert('保存に失敗しました。データ量が多すぎるか、この環境ではブラウザに保存できない可能性があります（プライベートブラウズモードなど）。画面上部に警告が出ていないかご確認ください。');
  }
  const STORE_RECORDS='property-records';
  const STORE_CUSTOM_WORK='custom-work-contents';
  const STORE_WORK_PRICE='work-content-prices';
  const STORE_MASTERS='select-masters';

  function updateClock(){
    const d=new Date();
    const days=['日','月','火','水','木','金','土'];
    $('nowDate').textContent=`${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;
    $('nowTime').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  updateClock(); setInterval(updateClock,15000);

  function getVal(obj,path){return path.split('.').reduce((o,k)=>(o&&o[k]!==undefined&&o[k]!==null)?o[k]:undefined,obj);}
  function setVal(obj,path,val){const keys=path.split('.');let o=obj;for(let i=0;i<keys.length-1;i++){if(!o[keys[i]]||typeof o[keys[i]]!=='object')o[keys[i]]={};o=o[keys[i]];}o[keys[keys.length-1]]=val;}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  function blankRecord(){
    return { meta:{id:null, createdAt:null}, basic:{}, equipment:{ aircon:[{}] }, workItems:[], notes:{}, documents:{} };
  }
  let record = blankRecord();
  let currentDocType = 'estimate';
  let companyInfo = {};
  let customWorkContents = []; // [{name,unit}]
  let workPriceMaster = {}; // { companyKey: { contentName: price } }, companyKey '__common__' = fallback
  let currentPriceCompany = '__common__';
  let masters = {}; // masterKey -> string[]

  /* ---------------- master (pulldown) registry ---------------- */
  const MASTER_REGISTRY = {
    tantou:            {label:'担当',                 group:'基本情報',   options:[]},
    managementCompany: {label:'管理会社名',           group:'基本情報',   options:[]},
    managementContact: {label:'管理会社 担当者名',     group:'基本情報',   options:[]},
    workType:          {label:'工事種類',               group:'基本情報',   options:['原状回復','修繕','フルリノベ','リフォーム','その他']},
    autoLockStatus:    {label:'オートロック',           group:'基本情報',   options:['有','無','鍵対応']},

    aircon_location:   {label:'エアコン 設置箇所',       group:'エアコン',   options:['LDK','洋室','和室','その他']},
    aircon_maker:      {label:'エアコン メーカー',       group:'エアコン',   options:['ダイキン','パナソニック','東芝','日立','三菱','シャープ','富士通','その他']},
    aircon_pipe:       {label:'エアコン 配管',           group:'エアコン',   options:['露出','隠蔽']},

    kitchen_type:      {label:'キッチン 種別',           group:'キッチン',   options:['システムキッチン','キッチンセット','ミニキッチン']},
    kitchen_stoveType: {label:'コンロ種別',              group:'キッチン',   options:['ガス','IH','電気','電磁']},
    kitchen_ovenType:  {label:'オーブン種別',            group:'キッチン',   options:['ガス','電気']},
    kitchen_purifierType:{label:'浄水器フィルター種類',  group:'キッチン',   options:['アンダーシンク型','蛇口一体型']},

    bath_type:         {label:'風呂 形式',               group:'風呂・給湯', options:['ユニットバス','在来']},
    bath_dryerFuel:    {label:'浴室乾燥機 燃料',         group:'風呂・給湯', options:['ガス','電気']},

  /* ---------------- generic schema-driven field renderer ---------------- */
  function fieldHtml(f, basePath){
    const path=basePath+'.'+f.key;
    const val=getVal(record,path);
    let inner='';
    if(f.type==='select'){
      const opts = f.masterKey ? masterOptions(f.masterKey) : (f.options||[]);
      inner=`<select data-path="${path}">`+
        `<option value="">選択してください</option>`+
        opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')+`</select>`;
    } else if(f.type==='multiselect'){
      const arr=Array.isArray(val)?val:[];
      inner=`<div class="chips" data-path="${path}" data-type="multiselect">`+
        f.options.map(o=>`<div class="chip${arr.includes(o)?' selected':''}" data-v="${esc(o)}">${esc(o)}</div>`).join('')+`</div>`;
    } else if(f.type==='yesno'){
      inner=`<div class="chips" data-path="${path}" data-type="yesno">
        <div class="chip yes${val==='有'?' selected':''}" data-v="有">有</div>
        <div class="chip no${val==='無'?' selected':''}" data-v="無">無</div></div>`;
    } else if(f.type==='text'){
      inner=`<input type="text" data-path="${path}" value="${esc(val||'')}" placeholder="${esc(f.placeholder||'')}"${f.list?` list="${f.list}"`:''}>`;
    } else if(f.type==='yearText'){
      inner=`<div class="inline-suffix"><input type="text" inputmode="numeric" data-path="${path}" value="${esc(val||'')}" placeholder="例：2020"><span>年</span></div>`;
    } else if(f.type==='date'){
      inner=`<input type="date" data-path="${path}" value="${esc(val||'')}">`;
    } else if(f.type==='textarea'){
      inner=`<textarea data-path="${path}" placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea>`;
    }
    return `<div class="field"><span class="field-label">${esc(f.label)}</span>${inner}</div>`;
  }

  function renderCard(cardDef, basePath){
    return `<div class="card"><h3>${esc(cardDef.title)}</h3>${cardDef.fields.map(f=>fieldHtml(f,basePath)).join('')}</div>`;
  }

  function bindFieldEvents(container){
    container.querySelectorAll('.chips[data-path]').forEach(group=>{
      const path=group.dataset.path, type=group.dataset.type;
      group.querySelectorAll('.chip').forEach(chip=>{
        chip.addEventListener('click',()=>{
          const v=chip.dataset.v;
          if(type==='yesno'){
            setVal(record,path,v);
            group.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
            chip.classList.add('selected');
          } else if(type==='multiselect'){
            let arr=getVal(record,path); if(!Array.isArray(arr))arr=[];
            if(arr.includes(v)){arr=arr.filter(x=>x!==v);chip.classList.remove('selected');}
            else{arr.push(v);chip.classList.add('selected');}
            setVal(record,path,arr);
          }
        });
      });
    });
    container.querySelectorAll('input[data-path],textarea[data-path]').forEach(inp=>{
      inp.addEventListener('input',()=>{ setVal(record, inp.dataset.path, inp.value); });
    });
    container.querySelectorAll('select[data-path]').forEach(sel=>{
      sel.addEventListener('change',()=>{ setVal(record, sel.dataset.path, sel.value || null); });
    });
  }

  function renderBasic(){
    const el=$('tab-basic');
    const company=(record.basic&&record.basic.managementCompany)||'';
    const propNames=(propertyMaster[company]||[]).map(p=>p.name);
    const datalistHtml=`<datalist id="propertyNameDatalist">${propNames.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`;
    el.innerHTML=basicCards.map(c=>renderCard(c,'basic')).join('')+datalistHtml;
    bindFieldEvents(el);

    const nameInput=el.querySelector('[data-path="basic.propertyName"]');
    const companySelect=el.querySelector('[data-path="basic.managementCompany"]');
    const addressInput=el.querySelector('[data-path="basic.address"]');
    const autoLockSelect=el.querySelector('[data-path="basic.autoLock"]');
    const elevatorGroup=el.querySelector('[data-path="basic.elevator"]');

    function applyPropertyLookup(){
      const co=(record.basic.managementCompany||'').trim();
      const nm=(record.basic.propertyName||'').trim();
      const entry=findPropertyInMaster(co, nm);
      if(entry){
        let changed=false;
        if(entry.address && !record.basic.address){ record.basic.address=entry.address; changed=true; }
        if(entry.al && !record.basic.autoLock){ record.basic.autoLock=entry.al; changed=true; }
        if(entry.ev && !record.basic.elevator){ record.basic.elevator = (entry.ev==='有')?'有':(entry.ev==='無'?'無':entry.ev); changed=true; }
        if(changed) renderBasic();
      }
    }
    if(nameInput){
      nameInput.addEventListener('change', applyPropertyLookup);
      nameInput.addEventListener('blur', syncPropertyToMaster);
    }
    if(companySelect){
      companySelect.addEventListener('change', ()=>{ applyPropertyLookup(); renderBasic(); });
    }
    if(addressInput) addressInput.addEventListener('blur', syncPropertyToMaster);
    if(autoLockSelect) autoLockSelect.addEventListener('change', syncPropertyToMaster);
    if(elevatorGroup) elevatorGroup.addEventListener('click', ()=>{ setTimeout(syncPropertyToMaster, 0); });
  }

  function seedCompanyPriceDefaults(){
    let changed=false;
    if(!masters.managementCompany) masters.managementCompany=[];
    Object.keys(COMPANY_PRICE_DEFAULTS).forEach(company=>{
      if(!masters.managementCompany.includes(company)){ masters.managementCompany.push(company); changed=true; }
      if(!workPriceMaster[company]) workPriceMaster[company]={};
      Object.keys(COMPANY_PRICE_DEFAULTS[company]).forEach(item=>{
        if(workPriceMaster[company][item]===undefined){
          workPriceMaster[company][item]=COMPANY_PRICE_DEFAULTS[company][item];
          changed=true;
        }
      });
    });
    return changed;
  }

  // 以前のバージョンで登録されていた会社名の表記ゆれを、正式名称に統一する
  const COMPANY_NAME_MIGRATION = {
    'FREX TOKYO':'FLEX TOKYO',
    'フィディラルコミニティ':'フィディラルコミュニティ',
    'ベストホームクリエイト':'ベストホームクリエート',
    'リアルエステート':'リアルホームエステート',
  };
  function migrateCompanyNames(){
    let mastersChanged=false, priceChanged=false, propChanged=false;
    Object.keys(COMPANY_NAME_MIGRATION).forEach(oldName=>{
      const newName=COMPANY_NAME_MIGRATION[oldName];
      if(masters.managementCompany && masters.managementCompany.includes(oldName)){
        masters.managementCompany = masters.managementCompany.filter(c=>c!==oldName);
        if(!masters.managementCompany.includes(newName)) masters.managementCompany.push(newName);
        mastersChanged=true;
      }
      if(workPriceMaster[oldName]){
        if(!workPriceMaster[newName]) workPriceMaster[newName]={};
        Object.keys(workPriceMaster[oldName]).forEach(item=>{
          if(workPriceMaster[newName][item]===undefined) workPriceMaster[newName][item]=workPriceMaster[oldName][item];
        });
        delete workPriceMaster[oldName];
        priceChanged=true;
      }
      if(propertyMaster[oldName]){
        if(!propertyMaster[newName]) propertyMaster[newName]=[];
        propertyMaster[newName] = propertyMaster[newName].concat(propertyMaster[oldName]);
        delete propertyMaster[oldName];
        propChanged=true;
      }
    });
    return {mastersChanged, priceChanged, propChanged};
  }

  const STORE_PROPERTY_MASTER='property-master';
  let propertyMaster={};
  async function loadPropertyMaster(){
    try{ const res=await storageAPI.get(STORE_PROPERTY_MASTER); if(res&&res.value) return JSON.parse(res.value); }catch(e){}
    return {};
  }
  async function savePropertyMaster(){
    try{ const res=await storageAPI.set(STORE_PROPERTY_MASTER, JSON.stringify(propertyMaster)); return !!res; }
    catch(e){ console.error(e); return false; }
  }
  function seedPropertyMasterDefaults(){
    let changed=false;
    if(!masters.managementCompany) masters.managementCompany=[];
    Object.keys(DEFAULT_PROPERTY_MASTER).forEach(company=>{
      if(company!=='その他' && !masters.managementCompany.includes(company)){ masters.managementCompany.push(company); changed=true; }
      if(!propertyMaster[company]){ propertyMaster[company]=DEFAULT_PROPERTY_MASTER[company].slice(); changed=true; }
    });
    return changed;
  }
  function findPropertyInMaster(company, name){
    if(!company || !name || !propertyMaster[company]) return null;
    const target=name.trim().toLowerCase();
    return propertyMaster[company].find(p=>p.name.trim().toLowerCase()===target) || null;
  }
  // 物件名・所在地・オートロック・エレベーターのいずれかを入力し終えたら、物件マスタに新規登録／内容更新する
  function syncPropertyToMaster(){
    const b=record.basic||{};
    const company=(b.managementCompany||'').trim();
    const name=(b.propertyName||'').trim();
    if(!company || !name) return;
    if(!propertyMaster[company]) propertyMaster[company]=[];
    let entry=findPropertyInMaster(company, name);
    let changed=false;
    if(!entry){ entry={name}; propertyMaster[company].push(entry); changed=true; }
    if(b.address && entry.address!==b.address){ entry.address=b.address; changed=true; }
    if(b.autoLock && entry.al!==b.autoLock){ entry.al=b.autoLock; changed=true; }
    if(b.elevator && entry.ev!==b.elevator){ entry.ev=b.elevator; changed=true; }
    if(changed) savePropertyMaster();
  }

  function allWorkContentOptions(){
    const defaults=Object.keys(WORK_CONTENT_UNITS).map(name=>({name,unit:WORK_CONTENT_UNITS[name]}));
    const customs=(customWorkContents||[]).filter(c=>!WORK_CONTENT_UNITS[c.name]);
    return defaults.concat(customs);
  }

        <select data-wpath="${i}.location">
          <option value="">選択してください</option>
          ${locOpts.map(o=>`<option value="${esc(o)}" ${row.location===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><span class="field-label">工事内容</span>
        <select data-wpath="${i}.content">
          <option value="">選択してください</option>
          ${opts.map(o=>`<option value="${esc(o.name)}" ${row.content===o.name?'selected':''}>${esc(o.name)}${o.unit?`（${esc(o.unit)}）`:''}</option>`).join('')}
          <option value="__add__">＋ 新しい項目を追加...</option>
        </select>
      </div>
      <div class="new-chip-input" id="newChipInput-${i}" style="display:none;">
        <input type="text" id="newChipText-${i}" placeholder="項目名">
        <input type="text" id="newChipUnit-${i}" placeholder="単位（例：㎡）" style="max-width:70px;">
        <input type="text" id="newChipPrice-${i}" inputmode="decimal" placeholder="単価" style="max-width:70px;">
        <button type="button" data-confirmnew="${i}">追加</button>
      </div>
      <div class="subrow">
        <div class="field"><span class="field-label">品番</span><input type="text" data-wpath="${i}.model" value="${esc(row.model||'')}"></div>
      </div>
      <div class="subrow">
        <div class="field" style="flex:1.4;"><span class="field-label">数量</span>
          <div class="qty-row">
            <input type="text" inputmode="decimal" data-wpath="${i}.qty" value="${esc(row.qty||'')}">
            <button type="button" class="calc-btn" data-calcidx="${i}" data-calcfield="qty" title="電卓">🖩</button>
          </div>
        </div>
        <div class="field" style="flex:1;"><span class="field-label">単位</span>
          <select data-wpath="${i}.unit">
            <option value="">-</option>
            ${unitOpts.map(u=>`<option value="${esc(u)}" ${(row.unit||'')===u?'selected':''}>${esc(u)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="subrow">
        <div class="field"><span class="field-label">単価（単価マスタから自動入力・編集可）</span>
          <div class="qty-row">
            <input type="text" inputmode="decimal" data-wpath="${i}.unitPrice" value="${esc(row.unitPrice||'')}" placeholder="工事内容を選ぶと自動入力されます">
            <button type="button" class="calc-btn" data-calcidx="${i}" data-calcfield="unitPrice" title="電卓">🖩</button>
          </div>
        </div>
      </div>
      <div class="amount-row">
        <span class="amount-label">金額（単価×数量）</span>
        <span class="amount-value" id="amountDisplay-${i}">${row.amount?esc(row.amount)+'円':'-'}</span>
      </div>
      <button type="button" class="toggle-details" data-toggledetail="${i}">${row._open?'詳細を閉じる ▲':'見積・発注などの詳細を追加 ▼'}</button>
      <div class="work-details${row._open?' open':''}">
        <div class="field"><span class="field-label">状況（何故その工事が必要なのか）</span><input type="text" data-wpath="${i}.reason" value="${esc(row.reason||'')}"></div>
        <div class="subrow">
          <div class="field"><span class="field-label">見積単価</span><input type="text" data-wpath="${i}.estimateUnit" value="${esc(row.estimateUnit||'')}"></div>
          <div class="field"><span class="field-label">材料単価</span><input type="text" data-wpath="${i}.materialUnit" value="${esc(row.materialUnit||'')}"></div>
        </div>
        <div class="subrow">
          <div class="field"><span class="field-label">発注単価</span><input type="text" data-wpath="${i}.orderUnit" value="${esc(row.orderUnit||'')}"></div>
          <div class="field"><span class="field-label">発注先</span><input type="text" data-wpath="${i}.orderTo" value="${esc(row.orderTo||'')}"></div>
        </div>
      </div>
    </div>`;
  }

  function renderWork(){
    const el=$('tab-work');
    let html=`<div class="card"><h3>工事内容</h3><div id="workRows">`+
      record.workItems.map((r,i)=>renderWorkRow(r,i)).join('')+
      `</div><button type="button" class="add-line" id="addWorkRow">＋ 工事項目を追加</button></div>`;
    el.innerHTML=html;
    bindFieldEvents(el);
    bindWorkEvents(el);
  }

  function lookupWorkPrice(contentName){
    if(!contentName) return '';
    const company = record.basic && record.basic.managementCompany;
    if(company && workPriceMaster[company] && workPriceMaster[company][contentName]){
      return workPriceMaster[company][contentName];
    }
    if(workPriceMaster[COMMON_PRICE_KEY] && workPriceMaster[COMMON_PRICE_KEY][contentName]){
      return workPriceMaster[COMMON_PRICE_KEY][contentName];
    }
    return '';
  }

  function recalcRowAmount(idx){
    const row=record.workItems[idx];
    if(!row) return;
    const q=parseFloat(row.qty);
    const u=parseFloat(row.unitPrice);
    if(!isNaN(q) && !isNaN(u)){
      row.amount = String(Math.round(q*u*100)/100);
    } else {
      row.amount = '';
    }
  }
  function refreshAmountDisplay(idx){
    const el=document.getElementById('amountDisplay-'+idx);
    if(el){ const row=record.workItems[idx]; el.textContent = row && row.amount ? row.amount+'円' : '-'; }
  }

  function bindWorkEvents(el){
    $('addWorkRow').addEventListener('click',()=>{ record.workItems.push({}); renderWork(); });

    el.querySelectorAll('[data-wpath]').forEach(node=>{
      const [idxStr,key]=node.dataset.wpath.split('.');
      const idx=+idxStr;
      const isSelect=node.tagName==='SELECT';
      node.addEventListener(isSelect?'change':'input',()=>{
        const v=node.value;
        if(isSelect && key==='content' && v==='__add__'){
          node.value=record.workItems[idx].content||'';
          $('newChipInput-'+idx).style.display='flex';
          $('newChipText-'+idx).focus();
          return;
        }
        record.workItems[idx][key]=v || null;
        if(key==='content' && v){
          const found=allWorkContentOptions().find(o=>o.name===v);
          let changed=false;
          if(found && !record.workItems[idx].unit){ record.workItems[idx].unit=found.unit; changed=true; }
          const price=lookupWorkPrice(v);
          if(price){ record.workItems[idx].unitPrice=price; changed=true; }
          if(changed){ recalcRowAmount(idx); renderWork(); }
        } else if(key==='qty' || key==='unitPrice'){
          recalcRowAmount(idx);
          refreshAmountDisplay(idx);
        }
      });
    });

    el.querySelectorAll('[data-rmwork]').forEach(btn=>{
      btn.addEventListener('click',()=>{ record.workItems.splice(+btn.dataset.rmwork,1); renderWork(); });
    });
    el.querySelectorAll('[data-toggledetail]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=+btn.dataset.toggledetail;
        record.workItems[idx]._open=!record.workItems[idx]._open;
        renderWork();
      });
    });
    el.querySelectorAll('[data-confirmnew]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx=+btn.dataset.confirmnew;
        const name=$('newChipText-'+idx).value.trim();
        const unit=$('newChipUnit-'+idx).value.trim();
        const price=$('newChipPrice-'+idx).value.trim();
        if(!name) return;
        if(!customWorkContents.find(c=>c.name===name)) customWorkContents.push({name,unit});
        if(!await saveCustomWorkContents()) warnSaveFailed();
        if(price){
          const targetCompany=(record.basic && record.basic.managementCompany) || COMMON_PRICE_KEY;
          if(!workPriceMaster[targetCompany]) workPriceMaster[targetCompany]={};
          workPriceMaster[targetCompany][name]=price;
          if(!await saveWorkPriceMaster()) warnSaveFailed();
        }
        record.workItems[idx].content=name;
        record.workItems[idx].unit=unit || record.workItems[idx].unit || '';
        record.workItems[idx].unitPrice=price || record.workItems[idx].unitPrice || '';
        recalcRowAmount(idx);
        renderWork();
      });
    });
    el.querySelectorAll('[data-calcidx]').forEach(btn=>{
      btn.addEventListener('click',()=>calcOpen(+btn.dataset.calcidx, btn.dataset.calcfield||'qty'));
    });
  }

  /* ---------------- CALCULATOR ---------------- */
  let calcTargetIdx=null, calcTargetField='qty', calcExpr='';
  function calcOpen(idx, field){
    calcTargetIdx=idx;
    calcTargetField=field||'qty';
    calcExpr = record.workItems[idx][calcTargetField] || '';
    $('calcDisplay').textContent = calcExpr || '0';
    $('calcOverlay').classList.add('show');
  }
  function calcRefresh(){ $('calcDisplay').textContent = calcExpr || '0'; }
  document.querySelectorAll('.calc-grid [data-c]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const c=btn.dataset.c;
      if(c==='clear'){ calcExpr=''; }
      else if(c==='back'){ calcExpr=calcExpr.slice(0,-1); }
      else if(c==='eq'){
        if(/^[0-9+\-*/. ]+$/.test(calcExpr) && calcExpr.trim()){
          try{
            const result=Function('"use strict";return ('+calcExpr+')')();
            if(isFinite(result)) calcExpr=(Math.round(result*100)/100).toString();
          }catch(e){}
        }
      } else if(c==='op'){ calcExpr+=btn.dataset.op; }
      else { calcExpr+=c; }
      calcRefresh();
    });
  });
  $('calcCancel').addEventListener('click',()=>{ $('calcOverlay').classList.remove('show'); });
  $('calcOk').addEventListener('click',()=>{
    if(calcTargetIdx!=null){
      record.workItems[calcTargetIdx][calcTargetField]=calcExpr;
      if(calcTargetField==='qty' || calcTargetField==='unitPrice') recalcRowAmount(calcTargetIdx);
      renderWork();
    }
    $('calcOverlay').classList.remove('show');
  });

  /* ---------------- NOTES TAB ---------------- */
  const notesCard={title:'採寸・メモ／備考・連絡事項', fields:[
    {key:'measurements',label:'採寸・メモ',type:'textarea',placeholder:'寸法や現地で気づいたことを自由に記入'},
    {key:'remarks',label:'備考・連絡事項',type:'textarea',placeholder:'関係者への連絡事項など'},
  ]};
  function renderNotes(){
    const el=$('tab-notes');
    el.innerHTML=renderCard(notesCard,'notes');
    bindFieldEvents(el);
  }

  function docFieldHtml(f){
    const path='documents.'+currentDocType+'.'+f.key;
    const val=getVal(record,path);
    let inner;
    if(f.type==='date') inner=`<input type="date" data-docpath="${path}" value="${esc(val||'')}">`;
    else if(f.type==='textarea') inner=`<textarea data-docpath="${path}" placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea>`;
    else inner=`<input type="text" data-docpath="${path}" value="${esc(val||'')}" placeholder="${esc(f.placeholder||'')}">`;
    return `<div class="field"><span class="field-label">${esc(f.label)}</span>${inner}</div>`;
  }

  // items[].qty × items[].[priceField] を合計する。「サービス」など数値でない単価は0円扱い。
  function computeDocTotals(items, priceField){
    priceField = priceField || 'unitPrice';
    const sub = items.reduce((s,w)=>{
      const q=parseFloat(w.qty), u=parseFloat(w[priceField]);
      return s + ((!isNaN(q) && !isNaN(u)) ? q*u : 0);
    }, 0);
    const tax = Math.round(sub*0.1);
    return { sub, tax, total: sub+tax };
  }

  function fmtJaDate(d, withWeekday){

    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  function buildDocumentPrintHTML(docType, rec){
    const b=rec.basic||{};

    let html = `<div class="p-doc">`;

    // ---- title bar ----

    // left: client info

    html += `<div class="p-doc-line">物件名称；${esc(b.propertyName||'')}　${esc(b.room?b.room+' 号室':'')}</div>`;
    if(b.address) html += `<div class="p-doc-line">物件所在地；${esc(b.address)}</div>`;
    if(isOrder){
      if(b.autoLock) html += `<div class="p-doc-line">オートロック；${esc(b.autoLock)}${b.autoLockNo?`（${esc(b.autoLockNo)}）`:''}</div>`;
      if(b.elevator) html += `<div class="p-doc-line">エレベーター；${esc(b.elevator)}</div>`;
      if(df.keyDetail) html += `<div class="p-doc-line">部屋鍵；${esc(df.keyDetail)}</div>`;
      if(df.workDate) html += `<div class="p-doc-line">作業予定日；${esc(df.workDate)}</div>`;
    }
    if(isEstimate){
      if(df.validity) html += `<div class="p-doc-line">有効期限；　${esc(df.validity)}</div>`;
      if(df.clientPaymentTerms) html += `<div class="p-doc-line">支払条件；　${esc(df.clientPaymentTerms)}</div>`;

    }
    if(isUketsuke){

    }
    html += `</div>`;

    html += `<div class="p-doc-col p-doc-col-right p-doc-company-block">`;
    html += `<img class="p-doc-stamp" src="${COMPANY_STAMP_DATA_URI}" alt="角印">`;

    if(isOrder) html += `<div class="p-doc-line">【発注者】</div>`;
    html += `<div class="p-doc-line"><b>${esc(companyInfo.name||'')}</b>${isOrder&&companyInfo.reading?`（${esc(companyInfo.reading)}）`:''}</div>`;
    html += `<div class="p-doc-line">${esc((companyInfo.address||'').replace(/\n/g,'　'))}</div>`;
    html += `<div class="p-doc-line">TEL；${esc(companyInfo.tel||'')}</div>`;

    if(isOrder && companyInfo.subPaymentTerms) html += `<div class="p-doc-line">支払条件：${esc(companyInfo.subPaymentTerms)}</div>`;

    // ---- items table ----

      items.forEach(w=>{

          const q=parseFloat(w.qty), u=parseFloat(priceRaw);

        }
        html+=`<tr><td>${esc(w.location||'')}</td><td>${esc(w.content||'')}</td><td>${esc(w.model||'')}</td><td>${esc(w.qty||'')}${esc(w.unit||'')}</td><td>${priceCell}</td><td>${amountCell}</td></tr>`;

    if(!isOrder){

    // ---- order-specific footer ----
    if(isOrder){
      html += `<div class="small-note" style="margin:10px 0;">【備考】${df.orderNote?esc(df.orderNote).replace(/\n/g,'<br>'):'※上記項目以外に修繕が必要と思われる箇所がある場合は必ずご一報下さい。'}</div>`;
      if(df.otherContractors) html += `<div class="p-doc-line"><b>【その他施行予定業者】</b>　${esc(df.otherContractors)}</div>`;
      html += `<table class="p-kv" style="margin-top:8px;">
        ${parkingFee?`<tr><th>駐車場代</th><td>${parkingFee.toLocaleString()}円</td></tr>`:''}
        <tr><th>小計</th><td>${totals.sub.toLocaleString()}円</td></tr>
        <tr><th>税率10%</th><td>${totals.tax.toLocaleString()}円</td></tr>
        <tr><th>発注請元</th><td>${esc(b.managementCompany||'')}</td></tr>
        <tr><th>合計</th><td><b>${grandTotal.toLocaleString()}円</b></td></tr>
      </table>`;
    }

    // ---- uketsuke-specific footer ----
    if(isUketsuke){
      html += `<div class="p-doc-line" style="margin-top:10px;">工事概要：${esc(df.workSummary||'')}</div>`;
      html += `<div class="p-doc-line">支払条件：${esc(df.clientPaymentTerms||'')}</div>`;
      html += `<div class="p-doc-line">有効期限：${esc(df.validity||'')}</div>`;
    }

    // ---- estimate sign-off box ----
    if(isEstimate){
      html += `<div class="p-signoff">
        <div class="p-signoff-title">【工事発注書】<span style="float:right;">令和　　年　　月　　日</span></div>
        <div>上記工事内容、金額を了承し工事を発注致します。</div>
        <div class="p-signoff-line">御社名；　　　　　　　　　　　　　　　　　　　　　　担当者；　　　　　　　　　　</div>
      </div>`;
    }

    html += `</div>`;
    return html;
  }

  function exportDocumentPdf(docType, rec){
    const doc = buildFullPrintDocument(rec, buildDocumentPrintHTML(docType, rec), DOC_TYPE_TITLES[docType]);
    let w=null;
    try{ w=window.open('', '_blank'); }catch(e){ w=null; }
    if(w){ w.document.open(); w.document.write(doc); w.document.close(); }
    else {
      try{
        const blob=new Blob([doc],{type:'text/html'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=(DOC_TYPE_TITLES[docType]||'書類')+'.html';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url),5000);
        alert('この画面では新しいタブを開けなかったため、印刷用のファイルをダウンロードしました。ダウンロードしたファイルを開いて印刷（PDF保存）してください。');
      }catch(e){ alert('PDF出力に失敗しました。'); }
    }
  }

    lines.push('保存方式: '+(hasArtifactStorage?'Claude.aiのアーティファクト保存':'ブラウザのlocalStorage'));
    lines.push('');
    const items=[
      ['記録一覧', STORE_RECORDS],
      ['工事内容カスタム', STORE_CUSTOM_WORK],
      ['単価マスタ', STORE_WORK_PRICE],
      ['選択マスタ（担当・管理会社等）', STORE_MASTERS],
      ['物件マスタ', STORE_PROPERTY_MASTER],
      ['会社情報', STORE_COMPANY_INFO],
    ];
    items.forEach(([label,key])=>{
      if(hasArtifactStorage){
        lines.push(label+'：Claude.ai内保存のため、ここでは確認できません');

        try{

          lines.push(label+'：'+(raw===null?'データなし':raw.length+'文字保存されています'));

  function renderSettings(){
    const el=$('settingsBody');
    const nav=`<div class="settings-subnav">${SETTINGS_TAB_ORDER.map(k=>
      `<button type="button" class="settings-tab-btn${k===currentSettingsTab?' active':''}" data-stab="${k}">${esc(SETTINGS_TAB_LABELS[k])}</button>`
    ).join('')}</div>`;
    const groupsToShow = SETTINGS_GROUP_ORDER.filter(g=>SETTINGS_TAB_GROUPS[currentSettingsTab].includes(g));
    let body = `<button type="button" class="add-line" id="storageDiagBtn" style="margin-bottom:14px;">保存状況を診断</button>`;
    body += groupsToShow.map(group=>{
      const keys=Object.keys(MASTER_REGISTRY).filter(k=>MASTER_REGISTRY[k].group===group);
      return `<div class="settings-group"><div class="settings-group-title">${esc(group)}</div>${keys.map(renderMasterCard).join('')}</div>`;
    }).join('');
    if(currentSettingsTab==='basic') body += renderCompanyInfoCard();
    if(currentSettingsTab==='work') body += renderPriceMasterCard();
    if(currentSettingsTab==='property') body += renderPropertyMasterCard();
    el.innerHTML = nav + body;

      btn.addEventListener('click',()=>{ currentSettingsTab=btn.dataset.stab; renderSettings(); });

  function bindSettingsEvents(el){
    const companySelect=el.querySelector('#priceCompanySelect');
    if(companySelect){
      companySelect.addEventListener('change',()=>{ currentPriceCompany=companySelect.value; renderSettings(); });
    }
    const propCompanySelect=el.querySelector('#propertyCompanySelect');
    if(propCompanySelect){
      propCompanySelect.addEventListener('change',()=>{ currentPropertyCompany=propCompanySelect.value; propertySearchQuery=''; renderSettings(); });
    }
    const propSearchInput=el.querySelector('#propertySearchInput');
    const propSearchBtn=el.querySelector('#propertySearchBtn');
    if(propSearchBtn){
      propSearchBtn.addEventListener('click',()=>{ propertySearchQuery=propSearchInput.value; renderSettings(); });
    }
    if(propSearchInput){
      propSearchInput.addEventListener('keydown',(e)=>{
        if(e.key==='Enter'){ e.preventDefault(); propertySearchQuery=propSearchInput.value; renderSettings(); }
      });
    }
    el.querySelectorAll('[data-delprop]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('この物件をマスタから削除しますか？')) return;
        const idx=+btn.dataset.delprop;
        propertyMaster[currentPropertyCompany].splice(idx,1);
        if(!await savePropertyMaster()) warnSaveFailed();
        renderSettings();
      });
    });
    const propAddBtn=el.querySelector('#propAddBtn');
    if(propAddBtn){
      propAddBtn.addEventListener('click', async ()=>{
        const name=$('propNewName').value.trim();
        if(!name) return;
        const address=$('propNewAddress').value.trim();
        const al=$('propNewAl').value;
        const ev=$('propNewEv').value;
        if(!propertyMaster[currentPropertyCompany]) propertyMaster[currentPropertyCompany]=[];
        let entry=propertyMaster[currentPropertyCompany].find(p=>p.name.toLowerCase()===name.toLowerCase());
        if(!entry){ entry={name}; propertyMaster[currentPropertyCompany].push(entry); }
        if(address) entry.address=address;
        if(al) entry.al=al;
        if(ev) entry.ev=ev;
        if(!await savePropertyMaster()) warnSaveFailed();
        renderSettings();
      });
    }
    const companyInfoSaveBtn=el.querySelector('#companyInfoSaveBtn');
    if(companyInfoSaveBtn){
      companyInfoSaveBtn.addEventListener('click', async ()=>{
        companyInfo={
          name: $('companyNameInput').value.trim(),
          reading: $('companyReadingInput').value.trim(),
          address: $('companyAddressInput').value,
          tel: $('companyTelInput').value.trim(),
          contact: $('companyContactInput').value.trim(),
          clientPaymentTerms: $('companyClientPayInput').value.trim(),
          subPaymentTerms: $('companySubPayInput').value.trim(),
        };
        const ok = await saveCompanyInfo();
        if(!ok){ warnSaveFailed(); return; }
        companyInfoSaveBtn.textContent='保存しました ✓';
        setTimeout(()=>{ companyInfoSaveBtn.textContent='保存'; },1200);
      });
    }
    el.querySelectorAll('[data-priceinput]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const name=inp.dataset.priceinput;
        if(!workPriceMaster[currentPriceCompany]) workPriceMaster[currentPriceCompany]={};
        workPriceMaster[currentPriceCompany][name]=inp.value.trim();
        if(!await saveWorkPriceMaster()) warnSaveFailed();
      });
    });
    const priceNewAddBtn=el.querySelector('#priceNewAddBtn');
    if(priceNewAddBtn){
      priceNewAddBtn.addEventListener('click', async ()=>{
        const name=$('priceNewName').value.trim();
        const unit=$('priceNewUnit').value.trim();
        const price=$('priceNewPrice').value.trim();
        if(!name) return;
        const alreadyKnown = !!WORK_CONTENT_UNITS[name] || customWorkContents.some(c=>c.name===name);
        if(!alreadyKnown){
          customWorkContents.push({name,unit});
          if(!await saveCustomWorkContents()) warnSaveFailed();
        }
        if(price){
          if(!workPriceMaster[currentPriceCompany]) workPriceMaster[currentPriceCompany]={};
          workPriceMaster[currentPriceCompany][name]=price;
          if(!await saveWorkPriceMaster()) warnSaveFailed();
        }
        renderSettings();
      });
    }
    el.querySelectorAll('[data-addbtn]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const key=btn.dataset.addbtn;
        const inp=$('madd-'+key);
        const val=inp.value.trim();
        if(!val) return;
        if(!masters[key]) masters[key]=[];
        if(!masters[key].includes(val)) masters[key].push(val);
        if(!await saveMasters()) warnSaveFailed();
        renderSettings();
      });
    });
    el.querySelectorAll('[data-rmopt]').forEach(span=>{
      span.addEventListener('click', async ()=>{
        const [key,idxStr]=span.dataset.rmopt.split('::');
        masters[key].splice(+idxStr,1);
        if(!await saveMasters()) warnSaveFailed();
        renderSettings();
      });
    });
    el.querySelectorAll('[data-resetkey]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const key=btn.dataset.resetkey;
        if(!confirm('この項目を初期設定に戻しますか？追加した内容は削除されます。')) return;
        masters[key]=MASTER_REGISTRY[key].options.slice();
        if(!await saveMasters()) warnSaveFailed();
        renderSettings();
      });
    });
  }

  /* ---------------- STORAGE ---------------- */
  async function loadCustomWorkContents(){
    try{ const res=await storageAPI.get(STORE_CUSTOM_WORK); if(res&&res.value){
      const raw=JSON.parse(res.value);
      return raw.map(c=> typeof c==='string' ? {name:c,unit:''} : c);
    }}catch(e){}
    return [];
  }
  async function saveCustomWorkContents(){
    try{ const res=await storageAPI.set(STORE_CUSTOM_WORK, JSON.stringify(customWorkContents)); return !!res; }
    catch(e){ console.error(e); return false; }
  }
  async function loadWorkPriceMaster(){
    try{
      const res=await storageAPI.get(STORE_WORK_PRICE);
      if(res&&res.value){
        const raw=JSON.parse(res.value);
        const keys=Object.keys(raw);
        // 旧形式（{ 項目名: 単価 } のフラットな構造）だった場合は「共通」に移行する
        const isOldFlat = keys.length>0 && typeof raw[keys[0]] !== 'object';
        return isOldFlat ? { [COMMON_PRICE_KEY]: raw } : raw;
      }
    }catch(e){}
    return {};
  }
  async function saveWorkPriceMaster(){
    try{ const res=await storageAPI.set(STORE_WORK_PRICE, JSON.stringify(workPriceMaster)); return !!res; }
    catch(e){ console.error(e); return false; }
  }
  async function loadRecords(){
    try{ const res=await storageAPI.get(STORE_RECORDS); if(res&&res.value) return JSON.parse(res.value); }catch(e){}
    return [];
  }
  async function saveRecords(list){
    try{ const res=await storageAPI.set(STORE_RECORDS, JSON.stringify(list)); return !!res; }

  }
  async function loadMasters(){
    try{ const res=await storageAPI.get(STORE_MASTERS); if(res&&res.value) return JSON.parse(res.value); }catch(e){}
    return {};
  }
  async function saveMasters(){
    try{ const res=await storageAPI.set(STORE_MASTERS, JSON.stringify(masters)); return !!res; }
    catch(e){ console.error(e); return false; }
  }

    return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function buildSummaryText(rec){
    const b=rec.basic||{}; const c=rec.cleaning||{}; const n=rec.notes||{};
    const lines=[];
    lines.push(`【物件情報】`);
    lines.push(`物件名：${b.propertyName||''}　所在地：${b.address||''}　号室：${b.room||''}　管理会社：${b.managementCompany||''}　立会日：${b.tachiaiDate||''}　担当：${b.tantou||''}`);
    lines.push(``,`【工事内容】`);
    if(rec.workItems && rec.workItems.length){
      rec.workItems.forEach(w=>{
        lines.push(`・${w.location||'(箇所未設定)'} / ${w.content||'(内容未設定)'} 数量:${w.qty||'-'}${w.unit||''} 単価:${w.unitPrice||'-'} 金額:${w.amount||'-'} 品番:${w.model||'-'}${w.reason?(' 状況:'+w.reason):''}`);
      });
    } else { lines.push('(工事項目なし)'); }
    lines.push(``,`【クリーニング・原状回復】`);
    lines.push(`ルームクリーニング:${c.roomCleaningM2||'-'}㎡　エアコン洗浄:${c.airconCleaning||'-'}(${c.airconCleaningCount||'-'}台)　WAX:${c.wax||'-'}　クロスクリーニング:${c.crossCleaning||'-'}`);
    lines.push(``,`【採寸・備考】`, n.measurements||'', n.remarks||'');
    return lines.join('\n');
  }

  /* ---------------- PDF / PRINT ---------------- */
  function fmtValue(f,val){
    if(val===undefined||val===null||val==='') return null;
    if(Array.isArray(val)){ if(!val.length) return null; return val.join('、'); }
    if(f.type==='yearText') return val+'年';
    return String(val);
  }
  function collectCardRows(rec, card, basePath){
    const rows=[];
    card.fields.forEach(f=>{
      const val=getVal(rec, basePath+'.'+f.key);
      const disp=fmtValue(f,val);
      if(disp) rows.push([f.label, disp]);
    });
    return rows;
  }
  function printSection(title, rows){
    return `<div class="p-section"><h4>${esc(title)}</h4><table class="p-kv">${rows.map(([l,v])=>`<tr><th>${esc(l)}</th><td>${esc(v)}</td></tr>`).join('')}</table></div>`;
  }
  function buildPrintHTML(rec){
    const b=rec.basic||{};
    let html='';
    html+=`<div class="p-header">
      <div class="p-title">${esc(b.propertyName||'（物件名未設定）')} ${esc(b.room||'')}</div>
      ${b.address?`<div class="p-sub">${esc(b.address)}</div>`:''}
      <div class="p-sub">管理会社：${esc(b.managementCompany||'-')}${b.managementContact?`（${esc(b.managementContact)}）`:''}　立会日：${esc(b.tachiaiDate||'-')}　担当：${esc(b.tantou||'-')}　工事種類：${esc(b.workType||'-')}</div>
      <div class="p-sub">出力日：${new Date().toLocaleDateString('ja-JP')}</div>
    </div>`;
    basicCards.forEach(card=>{
      if(card.title==='物件情報') return;
      const rows=collectCardRows(rec, card, 'basic');
      if(rows.length) html+=printSection(card.title, rows);
    });
    const airconRows=[];
    (rec.equipment&&rec.equipment.aircon||[]).forEach((item,i)=>{
      const lf=[['location','設置箇所'],['roomDetail','部屋詳細'],['maker','メーカー'],['model','品番'],['year','製造年'],['manual','取説'],['pipe','配管'],['sleeve','スリーブ'],['sleeveCount','スリーブ箇所数']];
      const parts=[];
      lf.forEach(([k,l])=>{ const v=item[k]; if(v) parts.push(`${l}:${v}${k==='year'?'年':''}`); });
      if(parts.length) airconRows.push([`エアコン${i+1}`, parts.join(' / ')]);
    });
    if(airconRows.length) html+=printSection('エアコン', airconRows);
    equipCards.forEach(card=>{
      const rows=collectCardRows(rec, card, 'equipment.'+card.key);
      if(rows.length) html+=printSection(card.title, rows);
    });
    if(rec.workItems && rec.workItems.length){
      html+=`<div class="p-section"><h4>工事内容</h4><table class="p-table"><thead><tr><th>箇所</th><th>工事内容</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th>品番</th><th>状況</th><th>発注先</th></tr></thead><tbody>`;
      rec.workItems.forEach(w=>{
        html+=`<tr><td>${esc(w.location||'-')}</td><td>${esc(w.content||'-')}</td><td>${esc(w.qty||'-')}</td><td>${esc(w.unit||'-')}</td><td>${esc(w.unitPrice||'-')}</td><td>${esc(w.amount||'-')}</td><td>${esc(w.model||'-')}</td><td>${esc(w.reason||'-')}</td><td>${esc(w.orderTo||'-')}</td></tr>`;
      });
      html+=`</tbody></table></div>`;
    }
    const n=rec.notes||{};
    if(n.measurements||n.remarks){
      html+=`<div class="p-section"><h4>採寸・備考</h4>`;
      if(n.measurements) html+=`<p class="p-text"><b>採寸・メモ：</b><br>${esc(n.measurements).replace(/\n/g,'<br>')}</p>`;
      if(n.remarks) html+=`<p class="p-text"><b>備考・連絡事項：</b><br>${esc(n.remarks).replace(/\n/g,'<br>')}</p>`;
      html+=`</div>`;
    }
    return html;
  }

  function buildFullPrintDocument(rec, contentHtmlOverride, titleOverride){
    const guide = `<div class="p-guide no-print">印刷ダイアログが自動で開かない場合は、キーボードの <b>Ctrl+P</b>（Macは <b>⌘+P</b>）を押すか、ブラウザメニューの「印刷」を選んでください。印刷画面で「PDFとして保存」を選ぶとPDF化できます。</div>`;
    const title = titleOverride || (rec.basic&&rec.basic.propertyName) || '物件メモ';
    const content = contentHtmlOverride!=null ? contentHtmlOverride : buildPrintHTML(rec);
    return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
      <title>${esc(title)} 出力</title>
      <style>${PRINT_STYLE}</style></head>
      <body>${guide}${content}
      <script>window.onload=function(){ setTimeout(function(){ try{ window.focus(); window.print(); }catch(e){} }, 250); };<\/script>
      </body></html>`;
  }

  function exportPdf(rec){
    const doc = buildFullPrintDocument(rec);
    let w = null;
    try{ w = window.open('', '_blank'); }catch(e){ w = null; }
    if(w){
      w.document.open();
      w.document.write(doc);
      w.document.close();
    } else {
      try{
        const blob = new Blob([doc], {type:'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = ((rec.basic&&rec.basic.propertyName)||'物件メモ') + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 5000);
        alert('この画面では新しいタブを開けなかったため、印刷用のファイルをダウンロードしました。ダウンロードしたファイルを開いて印刷（PDF保存）してください。');
      }catch(e){
        alert('PDF出力に失敗しました。お手数ですが「コピー」ボタンでテキストをコピーしてご利用ください。');
      }
    }
  }

    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+name));
  }
  document.querySelectorAll('#tabs button').forEach(btn=>{ btn.addEventListener('click',()=>switchTab(btn.dataset.tab)); });

  function renderAll(){ renderBasic(); renderEquip(); renderWork(); renderNotes(); renderDocs(); renderLog(); renderSettings(); }

  $('saveBtn').addEventListener('click', async ()=>{
    if(!record.meta.id){ record.meta.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); record.meta.createdAt=Date.now(); }
    record.meta.updatedAt=Date.now();
    const idx=allRecords.findIndex(r=>r.meta.id===record.meta.id);
    if(idx>=0) allRecords[idx]=JSON.parse(JSON.stringify(record));
    else allRecords.push(JSON.parse(JSON.stringify(record)));
    await saveRecords(allRecords);
    renderLog();
    $('saveBtn').textContent='保存しました ✓';
    setTimeout(()=>{ $('saveBtn').textContent='記録として保存'; },1200);
  });
  $('resetBtn').addEventListener('click', ()=>{
    if(!confirm('入力中の内容をクリアして新規作成します。よろしいですか？')) return;
    record=blankRecord(); renderAll(); switchTab('basic');
  });
  $('pdfBtn').addEventListener('click', ()=>{ exportPdf(record); });

  (async function init(){
    masters = await loadMasters();
    ensureMastersDefaults();
    customWorkContents = await loadCustomWorkContents();
    workPriceMaster = await loadWorkPriceMaster();
    propertyMaster = await loadPropertyMaster();
    companyInfo = await loadCompanyInfo();
    if(!companyInfo || !Object.keys(companyInfo).length){ companyInfo=Object.assign({}, DEFAULT_COMPANY_INFO); await saveCompanyInfo(); }
    else if(companyInfo.address && companyInfo.address.includes('九段南')){
      // 以前の版で入れていた仮の住所が残っている場合は、実際の書式に合わせて更新する
      companyInfo = Object.assign({}, DEFAULT_COMPANY_INFO, companyInfo, {address: DEFAULT_COMPANY_INFO.address});
      await saveCompanyInfo();
    }
    const commonSeeded = seedCommonPriceDefaults();
    const companySeeded = seedCompanyPriceDefaults();
    const propSeeded = seedPropertyMasterDefaults();
    const migration = migrateCompanyNames();
    if(commonSeeded || companySeeded || migration.priceChanged) await saveWorkPriceMaster();
    if(companySeeded || migration.mastersChanged) await saveMasters();
    if(propSeeded || migration.propChanged) await savePropertyMaster();
    allRecords = await loadRecords();
    await checkStorageWorking();
    renderAll();
  })();
})();
</script>
</body>
</html>
